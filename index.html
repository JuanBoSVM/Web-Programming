<!DOCTYPE html>
    <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title> Sign Up Form </title>

            <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
            
            <link rel="stylesheet" type="text/css" href="css/default-style.css">
        </head>

        <body>

            <header>

                <nav class="navbar navbar-expand-md p-3">
                    
                    <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#navbarOffcanvasMd" aria-controls="navbarOffcanvasMd" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    

                    <div class="offcanvas offcanvas-end" tabindex="-1" id="navbarOffcanvasMd" aria-labelledby="navbarOffcanvasMdLabel">
                        
                        <a class="nav-link active" href="index.html">
    
                            <img src="images/home.svg" alt="Home Icon">
                            Home
    
                        </a>
                        
                    </div>

                </nav>

            </header>


            <main class="container align-content-center">

                <form action="submit.php" method="post" class="form-container-md px-5 py-3">
                    
                    <div class="row align-items-center">

                        <div class="col-12">

                            <h1 class="text-center"> Sign Up </h1>

                        </div>

                    </div>

                    
                    <div class="row align-items-center">

                        <div class="col-sm-12 col-md-6 mb-3">

                            <div class="form-group">

                                <label for="firstName" class="form-label"> First Name </label>
                                <input type="text" class="form-control" id="firstName" name="firstName" placeholder="John" required>

                            </div>

                        </div>
                        

                        <div class="col-sm-12 col-md-6 mb-3">

                            <div class="form-group">

                                <label for="lastName" class="form-label"> Last Name </label>
                                <input type="text" class="form-control" id="lastName" name="lastName" placeholder="Doe" required>

                            </div>

                        </div>

                    </div>


                    <div class="row align-items-top">

                        <div class="col-sm-12 col-md-6 mb-3">

                            <div class="form-group">

                                <label for="email" class="form-label"> Email </label>


                                <div class="input-group">

                                    <input type="email" class="form-control" id="email" name="email" placeholder="john.doe" required>
                                    <span class="input-group-text user-select-none"> @ </span>
                                    <select class="form-select" id="emailDomain" name="emailDomain" required>
                                        <option value="gmail.com"> gmail </option>
                                        <option value="hotmail.com" > hotmail </option>
                                        <option value="yahoo.com"> yahoo </option>
                                        <option value="outlook.com"> outlook </option>
                                    </select>
                                    <span class="input-group-text user-select-none"> .com </span>

                                </div>

                            </div>

                        </div>
                        

                        <div class="col-sm-12 col-md-6 mb-3">

                            <div class="form-group">

                                <label for="password" class="form-label"> Password </label>
                                <input type="text" class="form-control" id="password" name="password" required>

                                <div id="passwordHelpBlock" class="form-text user-select-none">
                                    
                                    Your password must be 8-20 characters long.
            
                                </div>

                            </div>

                        </div>

                    </div>


                    <div class="row align-items-end">

                        <div class="col-sm-12 col-md-6 mb-3">

                            <div class="form-group">

                                <label for="dob" class="form-label"> Date of Birth </label>
                                <input type="date" class="form-control" id="dob" name="dob" required>

                            </div>

                        </div>
                        

                        <div class="col-sm-12 col-md-6 mb-3">

                            <div class="form-check">
                                
                                <input type="checkbox" class="form-check-input me-2" id="terms-and-conditions" name="terms-and-conditions" required>
                                <label for="terms-and-conditions" class="form-label user-select-none"> I have read and agree to the terms and conditions </label>

                            </div>

                        </div>

                    </div>


                    <div class="row justify-content-center">

                        <div class="col-sm-12 col-md-6 d-flex justify-content-center mt-3">

                            <button type="submit" class="btn btn-primary"> Submit </button>
                            
                        </div>

                    </div>

                </form>

            </main>

        </body>

    </html>
