<!DOCTYPE html>
    <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>My Web Page</title>
            <link rel="stylesheet" type="text/css" href="css/default-style.css">
            <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
            <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
        </head>
        <body>
            <header class="container-fluid">
                <nav class="container">
                    <a class="nav-link active" href="index.html">
                        <img src="images/home.svg" alt="Home Icon" class="">
                        Home
                    </a>
                </nav>
            </header>

            <main class="container align-content-center">
                <form action="submit.php" method="post" class="form-container">
                    <div class="row align-items-center m-5">
                        <div class="col-12">
                            <h1 class="text-center"> Sign Up </h1>
                        </div>
                    </div>

                    <div class="row align-items-center m-5">
                        <div class="col-6">
                            <div class="form-field d-flex align-items-center justify-content-end">
                                <label for="first-name" class="form-label"> First Name: </label>
                                <input type="text" id="first-name" name="first-name" placeholder="John" required>
                            </div>
                        </div>
                        
                        <div class="col-6">
                            <div class="form-field d-flex align-items-center justify-content-end">
                                <label for="phone-number" class="form-label"> Phone: </label>
                                <input type="tel" id="phone-number" name="phone-number" pattern="[0-9]{2}-[0-9]{2}-[0-9]{2}-[0-9]{2}-[0-9]{2} " placeholder="33-56-78-90-12" required>                                
                            </div>
                        </div>
                    </div>
                        
                    <div class="row align-items-center justify-content-end m-5">
                        <div class="col-6">
                            
                            <div class="form-field d-flex align-items-center justify-content-end">
                                <label for="email" class="form-label"> E-mail: </label>
                                <input type="email" id="email" name="email" placeholder="john.doe@example.com" required>
                            </div>
                        </div>

                        <div class="col-6">
                            <div class="form-field d-flex align-items-center justify-content-end">
                                <label for="password" class="form-label"> Password: </label>
                                <input type="password" id="password" name="password" placeholder="********" required>
                            </div>
                        </div>
                    </div>

                    <div class="row align-items-center justify-content-end m-5">
                        <div class="col-6 form-group justify-content-center">
                            <label class="form-label"> Gender: </label>
                            <div class="form-field justify-content-center">
                                <div class="form-field d-flex align-items-center">
                                    <input type="radio" id="male" name="gender" value="male" class="radio" required>
                                    <label for="male"> Male </label>
                                </div>
                                
                                <div class="form-field d-flex align-items-center">
                                    <input type="radio" id="female" name="gender" value="female" class="radio" required>
                                    <label for="female"> Female </label>
                                </div>

                                <div class="form-field d-flex align-items-center">
                                    <input type="radio" id="other" name="gender" value="other" class="radio" required>
                                    <label for="other"> Other </label>
                                </div>
                            </div>
                        </div>                        

                        <div class="col-2">
                            <label for="dob" class="form-label"> Date of Birth: </label>
                        </div>

                        <div class="col-4">
                            <input type="date" id="dob" name="dob" class="form-control" required>
                        </div>
                    </div>

                    <div class="row align-items-center justify-content-end m-5">
                        <div class="col-12 d-flex justify-content-center">
                            <button type="submit" class="btn-solid btn-lg">Submit</button>
                        </div>
                    </div>
                </form>
            </main>
        </body>
    </html>
