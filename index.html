        <body>

            <header>

                <nav class="navbar navbar-expand-md">

                    <div class="container-fluid d-flex justify-content-sm-end justify-content-md-start">

                        </a>

                    </div>

                </nav>

            <main class="container align-content-center">

                <form action="submit.php" method="post" class="form-container-md px-5 py-3">
                    
                    <div class="row align-items-center">

                        <div class="col-12">

                            <h1 class="text-center"> Sign Up </h1>

                        </div>

                    </div>

                    
                    <div class="row align-items-center">

                        <div class="col-sm-12 col-md-6 mb-3">

                            <div class="form-group">

                                <label for="firstName" class="form-label"> First Name </label>
                                <input type="text" class="form-control" id="firstName" name="firstName" placeholder="John" required>

                            </div>

                        </div>
                        

                        <div class="col-sm-12 col-md-6 mb-3">

                            <div class="form-group">

                                <label for="lastName" class="form-label"> Last Name </label>
                                <input type="text" class="form-control" id="lastName" name="lastName" placeholder="Doe" required>

                            </div>

                        </div>

                    </div>


                    <div class="row align-items-top">

                        <div class="col-sm-12 col-md-6 mb-3">

                            <div class="form-group">

                                <label for="email" class="form-label"> Email </label>


                                <div class="input-group">

                                    <input type="email" class="form-control" id="email" name="email" placeholder="john.doe@example.com" required>

                                </div>

                            </div>

                        </div>
                        

                        <div class="col-sm-12 col-md-6 mb-3">

                            <div class="form-group">

                                <label for="password" class="form-label"> Password </label>
                                <input type="password" class="form-control" id="password" name="password" required>

                                <div id="passwordHelpBlock" class="form-text user-select-none">
                                    
                                    Your password must be 8-20 characters long.
            
                                </div>

                            </div>

                        </div>

                    </div>


                    <div class="row align-items-end">

                        <div class="col-sm-12 col-md-6 mb-3">

                            <div class="form-group">

                                <label for="dob" class="form-label"> Date of Birth </label>
                                <input type="date" class="form-control" id="dob" name="dob" required>

                            </div>

                        </div>
                        

                        <div class="col-sm-12 col-md-6 mb-0">

                            <div class="row justify-content-center align-items-center">
                                
                                <div class="col-12">

                                    <h6 class="text-center"> Gender </h6>

                                </div>

                                <div class="form-check col-sm-12 col-md-6 d-flex justify-content-center">
                                
                                    <input class="form-check-input" type="radio" name="radioMale" id="radioMale">
                                    <label class="form-check-label" for="radioMale"> Male </label>
                                
                                </div>
                                
                                <div class="form-check col-sm-12 col-md-6 d-flex justify-content-center">
                                    <input class="form-check-input" type="radio" name="radioFemale" id="radioFemale">
                                    <label class="form-check-label" for="radioFemale">
                                    Female
                                    </label>
                                </div>
                                
                                <div class="row">
    
                                    <div class="form-check d-flex justify-content-center mt-3">
                                        
                                        <input type="checkbox" class="form-check-input me-2" id="terms-and-conditions" name="terms-and-conditions" required>
                                        <label for="terms-and-conditions" class="form-label user-select-none"> I have read and agree to the terms and conditions </label>
                                        
                                    </div>
                                    
                                </div>

                            </div>

                        </div>

                    </div>


                    <div class="row justify-content-center">

                        <div class="col-sm-12 col-md-6 d-flex justify-content-center mt-3">

                            <button type="submit" class="btn btn-primary"> Submit </button>
                            
                        </div>

                    </div>
