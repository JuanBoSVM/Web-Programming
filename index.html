<!DOCTYPE html>
<html lang="en">
    <head>
        <title>CSS Practice</title>
        <link rel="stylesheet" type="text/css" href="css/style.css">
    </head>

    <body>
        <nav>
            <a href="index.html">Home</a>
        </nav>

        <main>
            <table class="perfect">
                <tr>
                    <td>
                        <p class="special" id="first">
                            The first table cell is special
                        </p>                            
                    </td>

                    <td>
                        <h1 class="not-special" id="second">
                            The second table cell is not special
                        </h1>
                    </td>
                </tr>

                <tr>
                    <td>
                        <h2 class="sad" id="third">
                            The third table cell is sad
                        </h2>
                    </td>
                    
                    <td>
                        <h3 class="happy" id="fourth">
                            The fourth table cell is happy
                        </h3>
                    </td>
                </tr>
            </table>
        </main>
    </body>
</html>
